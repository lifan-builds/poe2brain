<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="poe2brain — Agent-Native Path of Exile 2 (0.5.5) Intelligence Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="52%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#160f14"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="22%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#d4a24c" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#9e6d24" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#090b10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="84%" cy="32%" r="42%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#0ea5e9" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#090b10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5620" stop-opacity="0.2"/>
      <stop offset="35%" stop-color="#f0c774" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#d4a24c" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="58%" stop-color="#f3cf82"/>
      <stop offset="100%" stop-color="#d4a24c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.032" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base plate -->
  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glowGold)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glowCyan)"/>
  <rect x="1.5" y="1.5" width="1277" height="337" rx="16.5" fill="none" stroke="#d4a24c" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- Left geometric PoE2 passive-orb emblem -->
  <g transform="translate(132, 170)">
    <circle r="84" fill="#0d1119" stroke="#d4a24c" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle r="68" fill="none" stroke="#d4a24c" stroke-opacity="0.24" stroke-width="1" stroke-dasharray="4 5"/>
    <circle r="48" fill="#131926" stroke="#38bdf8" stroke-opacity="0.42" stroke-width="1.5"/>
    <!-- Diamond & neural constellation -->
    <polygon points="0,-58 58,0 0,58 -58,0" fill="none" stroke="#f0c774" stroke-opacity="0.72" stroke-width="1.6"/>
    <line x1="-34" y1="-22" x2="0" y2="0" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.4"/>
    <line x1="34" y1="-22" x2="0" y2="0" stroke="#38bdf8" stroke-opacity="0.75" stroke-width="1.4"/>
    <line x1="-30" y1="26" x2="0" y2="0" stroke="#f0c774" stroke-opacity="0.75" stroke-width="1.4"/>
    <line x1="30" y1="26" x2="0" y2="0" stroke="#f0c774" stroke-opacity="0.75" stroke-width="1.4"/>
    <line x1="0" y1="-44" x2="0" y2="44" stroke="#f0c774" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="10" fill="#f0c774"/>
    <circle cx="0" cy="0" r="4.5" fill="#0b0e14"/>
    <circle cx="0" cy="-44" r="5" fill="#f0c774"/>
    <circle cx="0" cy="44" r="5" fill="#f0c774"/>
    <circle cx="-34" cy="-22" r="4.5" fill="#38bdf8"/>
    <circle cx="34" cy="-22" r="4.5" fill="#38bdf8"/>
    <circle cx="-30" cy="26" r="4.5" fill="#fb7185"/>
    <circle cx="30" cy="26" r="4.5" fill="#fb7185"/>
  </g>

  <!-- Title & subtitle -->
  <g transform="translate(254, 118)">
    <rect x="0" y="-44" width="298" height="26" rx="13" fill="#1b2232" stroke="#d4a24c" stroke-opacity="0.45" stroke-width="1"/>
    <text x="149" y="-27" text-anchor="middle" fill="#f0c774" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.2">PATH OF EXILE 2 · PATCH 0.5.5</text>

    <text x="0" y="34" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">poe2brain</text>

    <rect x="0" y="52" width="520" height="2" rx="1" fill="url(#goldLine)"/>

    <text x="0" y="88" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="500">
      Agent-Native PoE2 Intelligence Engine · CLI + 45 MCP Tools
    </text>
    <text x="0" y="118" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5">
      Headless PoB2 · 0.5.5 Ground Truth · Live Trade2 · Crafting EV · Loot Filters
    </text>
  </g>

  <!-- Right pillar stat cards -->
  <g transform="translate(868, 52)">
    <rect x="0" y="0" width="364" height="236" rx="14" fill="#0c1018" fill-opacity="0.88" stroke="#334155" stroke-opacity="0.7" stroke-width="1"/>
    <!-- Window dots -->
    <circle cx="20" cy="20" r="4.5" fill="#fb7185" fill-opacity="0.75"/>
    <circle cx="36" cy="20" r="4.5" fill="#f0c774" fill-opacity="0.75"/>
    <circle cx="52" cy="20" r="4.5" fill="#34d399" fill-opacity="0.75"/>
    <text x="72" y="24" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">poe2 ninja search --preset sleeper</text>
    <line x1="0" y1="38" x2="364" y2="38" stroke="#1e293b" stroke-width="1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
      <text x="18" y="64" fill="#38bdf8">$ poe2 version --json</text>
      <text x="18" y="86" fill="#94a3b8">patch: <tspan fill="#f0c774">"0.5.5"</tspan> · mcp: <tspan fill="#34d399">46 tools</tspan></text>
      <text x="18" y="106" fill="#94a3b8">pob2:  <tspan fill="#34d399">headless LuaJIT (0 compiler on Win)</tspan></text>

      <line x1="18" y1="122" x2="346" y2="122" stroke="#1e293b" stroke-width="1"/>

      <text x="18" y="146" fill="#f0c774">#1 Pathfinder Ice Shot</text>
      <text x="18" y="166" fill="#cbd5e1">   15.1M Real DPS · 29.6k EHP · <tspan fill="#34d399">1.99x Move</tspan></text>

      <text x="18" y="192" fill="#f0c774">#2 Acolyte Poisonburst Arrow</text>
      <text x="18" y="212" fill="#cbd5e1">    5.6M Real DPS · 36.4k EHP · <tspan fill="#34d399">1.71x Move</tspan></text>
    </g>
  </g>
</svg>
